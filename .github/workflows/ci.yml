name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
      - "fix/**"
      - "integration/**"
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Check whitespace
        run: git diff --check

      - name: Run Go tests
        run: go test ./...

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run frontend tests
        run: pnpm --dir web test

      - name: Build frontend
        run: pnpm --dir web build

      - name: Build distribution
        run: ./scripts/build.sh

  race-and-protocol-stress:
    name: Race detector and protocol stress
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Race detector (agent package)
        run: go test -race ./internal/agent -count=1

      # 概率型时序缺陷（如互动回合首候选锁定竞态）单次运行经常漏检：
      # 高重复 + GOMAXPROCS 扰动把漏检率压下去，但确定性回归测试才是主锁。
      - name: Interactive protocol stress
        run: |
          go test ./internal/agent -run 'InteractiveTurnProtocol' -count=300 -cpu=1,2,4
          go test -race ./internal/agent -run 'InteractiveTurnProtocol' -count=100

  windows-workspace-change:
    name: Windows workspace change regression
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize a workspace change store
        run: go test ./internal/workspacechange -run '^TestNewServiceInitializesWorkspaceChangeStoreOnWindows$' -count=1
